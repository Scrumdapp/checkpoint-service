spring.application.name=Checkpoint-Service
spring.config.import=optional:file:.env[.properties]

server.port=${APPLICATION_PORT:3000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scrumdapp}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}

groupService.url=${GROUP_SERVICE_URL:http://localhost:3000}
groupService.endpoint=${GROUP_FETCH_ENDPOINT:/groups/{groupId}/users}

passport.jwk-set-uri=${JWK-SET-URI}